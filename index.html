<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>乐谱可视化 — 竖版旋转布局</title>
  <!--
    加载顺序说明：
    1. p5.js — 核心库（必须先加载）
    2. p5.sound.js — 音频扩展（提供 loadSound、p5.FFT 等）
    3. sketch.js — 包含 Pitch 类、AudioAnalyzer 类及全部 p5.js 绘制代码
  -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.10.0/lib/p5.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.10.0/lib/addons/p5.sound.min.js"></script>
  <script src="sketch.js"></script>
  <style>
    /* 页面居中显示画布 */
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #d0d0d0;
    }
    /* 给画布加阴影，方便辨认边界 */
    canvas {
      display: block;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }
  </style>
</head>
<body>
</body>
</html>
